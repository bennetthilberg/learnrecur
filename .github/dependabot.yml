version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Keep routine minor and patch updates reviewable as one batch.
    # Security updates remain enabled through the repository's Dependabot
    # security-update settings and are not disabled or folded into this group.
    groups:
      vitest-tooling:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
      low-risk-npm-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        # Compute Engine and React Native 0.x updates can change behavior or
        # require matching overrides. Review them alone; keep Vitest paired.
        exclude-patterns:
          - "@cortex-js/compute-engine"
          - "react-native"
          - "vitest"
          - "@vitest/coverage-v8"
    # CI and Vercel run Node 24. Keep its types on that major until the
    # runtime is upgraded too; patch updates within Node 24 remain eligible.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # ESLint 10 currently crashes in minimatch before linting this repo.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"

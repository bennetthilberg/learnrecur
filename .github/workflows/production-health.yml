name: production health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Optional LearnRecur deployment URL to verify before promotion
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PRODUCTION_URL: ${{ inputs.deployment_url || 'https://alpha.learnrecur.com' }}
      READINESS_PROBE_SECRET: ${{ secrets.PRODUCTION_READINESS_PROBE_SECRET }}
      DEPLOYMENT_BYPASS_SECRET: ${{ secrets.PRODUCTION_DEPLOYMENT_BYPASS_SECRET }}
    steps:
      - name: Validate probe target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PRODUCTION_URL" != "https://alpha.learnrecur.com" ]]; then
            [[ "$PRODUCTION_URL" =~ ^https://learnrecur-[a-z0-9]+-learn-recur\.vercel\.app$ ]]
            test -n "$DEPLOYMENT_BYPASS_SECRET"
          fi
      - name: Check liveness
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$PRODUCTION_URL" != "https://alpha.learnrecur.com" ]]; then
            args=(-H "x-vercel-protection-bypass: $DEPLOYMENT_BYPASS_SECRET")
          fi
          response="$(curl --fail --silent --show-error --max-time 15 --retry 2 "${args[@]}" "$PRODUCTION_URL/api/health")"
          test "$(jq -r '.status' <<<"$response")" = "ok"

      - name: Check dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READINESS_PROBE_SECRET"
          args=()
          if [[ "$PRODUCTION_URL" != "https://alpha.learnrecur.com" ]]; then
            args=(-H "x-vercel-protection-bypass: $DEPLOYMENT_BYPASS_SECRET")
          fi
          response="$(curl --fail --silent --show-error --max-time 20 --retry 2 \
            "${args[@]}" \
            -H "Authorization: Bearer $READINESS_PROBE_SECRET" \
            "$PRODUCTION_URL/api/readiness")"
          test "$(jq -r '.status' <<<"$response")" = "ready"

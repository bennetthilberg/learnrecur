name: LearnRecur Linux backend
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learnrecur-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    if: github.repository == 'bennetthilberg/learnrecur'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ./.github/actions/setup-anki
      - run: git submodule update --init ftl/core-repo ftl/qt-repo
      - name: Build native client and matching server
        run: |
          ./ninja pylib
          cargo build --locked -p anki-sync-server
      - name: Check backup guards and companion behavior
        run: |
          ANKI_TEST_MODE=1 PYTHONPATH=.:pylib:out/pylib out/pyenv/bin/python -m pytest learnrecur/deploy/tests/test_backup.py learnrecur/companion/tests -q
          out/pyenv/bin/ruff check learnrecur/deploy learnrecur/companion
      - name: Build the Linux backend image
        run: docker build -f learnrecur/deploy/Dockerfile --build-arg BUILD_REVISION="$GITHUB_SHA" -t learnrecur-backend:test -t "learnrecur-backend:$GITHUB_SHA" .
      - name: Restore an encrypted backend backup
        run: |
          ANKI_TEST_MODE=1 PYTHONPATH=.:pylib:out/pylib out/pyenv/bin/python -m learnrecur.deploy.check_restore --root out/learnrecur/linux-restore-proof --image learnrecur-backend:test
      - name: Save the checked image for VPS transfer
        run: docker image save "learnrecur-backend:$GITHUB_SHA" | zstd -T0 -o out/learnrecur/backend-image.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: learnrecur-linux-${{ github.sha }}
          path: out/learnrecur/backend-image.tar.zst
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
